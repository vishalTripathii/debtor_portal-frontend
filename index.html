  <body>
    <div id="root"></div>
    <script>
      // Clear any cached OTP state and force app reload
      if (localStorage.getItem('demoOtp') || sessionStorage.getItem('demoOtp')) {
        localStorage.removeItem('demoOtp');
        sessionStorage.removeItem('demoOtp');
        console.log('Cleared cached OTP data');
      }
      // Force reload if version changed
      const currentVersion = 'v1.0.20-force-refresh';
      const storedVersion = localStorage.getItem('appVersion');
      if (storedVersion !== currentVersion) {
        localStorage.setItem('appVersion', currentVersion);
        console.log('Version updated, forcing refresh');
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
