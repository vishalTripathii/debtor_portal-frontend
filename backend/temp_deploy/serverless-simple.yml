service: debtor-portal-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.8
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  timeout: 30
  memorySize: 3008

  environment:
    DEBUG: 'False'
    STAGE: ${self:provider.stage}
    # MongoDB
    MONGODB_URI: ${ssm:/debtor-portal/${self:provider.stage}/mongodb-uri}
    # S3 (use existing bucket)
    S3_BUCKET_NAME: debtor-portal-media-dev
    S3_REGION: ${self:provider.region}
    USE_S3_STORAGE: 'True'
    AWS_STORAGE_BUCKET_NAME: debtor-portal-media-dev
    AWS_DEFAULT_ACL: 'public-read'
    AWS_S3_CUSTOM_DOMAIN: ''
    AWS_S3_OBJECT_PARAMETERS: '{"CacheControl": "max-age=86400"}'
    # Django
    SECRET_KEY: 'your-secret-key-here'
    ALLOWED_HOSTS: '*'
    # Email Settings
    EMAIL_BACKEND: 'django.core.mail.backends.console.EmailBackend'
    EMAIL_HOST: 'smtpout.secureserver.net'
    EMAIL_PORT: '587'
    EMAIL_USE_TLS: 'True'
    EMAIL_USE_SSL: 'False'
    EMAIL_HOST_USER: 'hello@poweramc.co'
    EMAIL_HOST_PASSWORD: 'Strive*12345'
    DEFAULT_FROM_EMAIL: 'hello@poweramc.co'

  iam:
    role:
      statements:
        # S3 permissions for existing bucket
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
            - s3:HeadObject
          Resource:
            - arn:aws:s3:::debtor-portal-media-dev
            - arn:aws:s3:::debtor-portal-media-dev/*
        # SSM Parameter Store
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:ap-southeast-1:*:parameter/debtor-portal/${self:provider.stage}/*

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    strip: true

plugins:
  - serverless-python-requirements
  - serverless-offline

functions:
  # Main Django API
  api:
    handler: lambda_handler.handler
    timeout: 30
    memorySize: 3008
    layers:
      - arn:aws:lambda:ap-southeast-1:770693421928:layer:Klayers-p38-opencv-python:35
      - arn:aws:lambda:ap-southeast-1:770693421928:layer:Klayers-p38-pyzbar:3
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.pytest_cache/**'
    - '!test_*.py'
    - '!tests/**'
    - '!**/__pycache__/**'
    - '!venv/**'
    - '!env/**'
    - '!.serverless/**'